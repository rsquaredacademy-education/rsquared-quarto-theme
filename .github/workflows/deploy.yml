name: Build & Deploy to Netlify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts and zip tools
        # Noble package names: fonts-linuxlibertine (not fonts-libertine).
        # bsdmainutils provides `cal` (missing on stock runners).
        run: sudo apt-get update && sudo apt-get install -y fonts-linuxlibertine fonts-dejavu-core zip unzip bsdmainutils

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.40"

      - name: Setup Typst
        # Quarto setup does NOT put typst on PATH; pdf-engine: typst needs this.
        uses: typst-community/setup-typst@v4

      # Discrete per-format renders: every `quarto render --to <fmt>` wipes
      # output-dir, and pre-render hooks fire only once per invocation.
      - name: Render HTML
        run: |
          Rscript scripts/reset-fixture.R
          quarto render --to html --output-dir /tmp/stage-html

      - name: Render PDF
        run: |
          Rscript scripts/reset-fixture.R
          quarto render --to pdf --output-dir /tmp/stage-pdf

      - name: Render ePub
        run: |
          Rscript scripts/reset-fixture.R
          quarto render --to epub --output-dir /tmp/stage-epub

      - name: Assemble docs
        run: |
          rm -rf docs && mkdir -p docs
          cp -r /tmp/stage-html/. docs/
          cp /tmp/stage-pdf/*.pdf docs/ || true
          cp /tmp/stage-epub/*.epub docs/ || true
          cp netlify.toml 404.html robots.txt docs/
          bash scripts/make-sitemap.sh docs https://__SUBDOMAIN__.rsquaredacademy.com

      - name: Verify redirects
        run: bash scripts/test-redirects.sh docs

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: "docs/**/*.html --root-dir docs --exclude 'mailto:*'"

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./docs
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: ${{ github.event.head_commit.message }}
        env:
          # Per-book secrets: add NETLIFY_SITE_ID + NETLIFY_AUTH_TOKEN in repo settings.
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
